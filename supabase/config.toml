# ══════════════════════════════════════════════════════════════════════════════
# MauriVote — Configuration Supabase CLI
# VERSION : SMS GRATUIT pour tous les utilisateurs
# ══════════════════════════════════════════════════════════════════════════════

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323
api_url = "http://localhost"

[inbucket]          # Serveur email de test local
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "50MiB"

# ── Auth ─────────────────────────────────────────────────────────────────────
[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://maurivote.mr"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false               # CRITIQUE : les électeurs ne s'inscrivent pas eux-mêmes

[auth.email]
enable_signup = false
enable_confirmations = false        # Pas d'email — seulement SMS OTP

# ══════════════════════════════════════════════════════════════════════════════
# SMS OTP — AFRICA'S TALKING (sandbox = gratuit · production = réel +222)
# ══════════════════════════════════════════════════════════════════════════════
# MODE SANDBOX (développement local) :
#   - Aucun vrai SMS envoyé
#   - Messages visibles dans : https://simulator.africastalking.com
#   - AT_USERNAME = "sandbox", AT_API_KEY = n'importe quoi
#
# MODE PRODUCTION (vrais SMS) :
#   - Créer compte sur africastalking.com (gratuit)
#   - Recharger crédit (5$ minimum → ~250 SMS vers +222)
#   - Remplacer AT_USERNAME par votre username AT
#   - Remplacer AT_API_KEY par votre clé API AT
# ══════════════════════════════════════════════════════════════════════════════
[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Votre code MauriVote : {{ .Code }} (valable 2 minutes)"

# Hook personnalisé : Supabase appelle notre Edge Function send-sms-otp
# qui envoie le vrai SMS via Africa's Talking
[auth.hook.send_sms]
enabled = true
uri     = "pg-functions://postgres/public/send_sms_hook"

# Fallback test_otp pour dev local SANS compte Africa's Talking
# (remplacer par les vrais numéros des électeurs en base)
[auth.sms.test_otp]
"22222934767" = "123456"
"22249885119" = "123456"

# ══════════════════════════════════════════════════════════════════════════════
# Realtime
# ══════════════════════════════════════════════════════════════════════════════
[realtime]
enabled = true

# ══════════════════════════════════════════════════════════════════════════════
# Edge Functions
# ══════════════════════════════════════════════════════════════════════════════
[functions.submit-vote]
verify_jwt = true

[functions.verify-vote]
verify_jwt = false      # Vérification publique (QR Code scan)

[functions.check-voted]
verify_jwt = true
