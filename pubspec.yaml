name: maurivote
description: Application de vote electronique - Republique Islamique de Mauritanie
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.3.0
  flutter_dotenv: ^6.0.1

  # Auth & Securite
  local_auth: ^3.0.1
  encrypt: ^5.0.3
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^17.2.3

  # State Management
  flutter_riverpod: ^3.3.1

  # UI
  shimmer: ^3.0.0
  fl_chart: ^1.2.0
  qr_flutter: ^4.1.0
  cached_network_image: ^3.3.0
  pin_code_fields: ^9.3.0
  cupertino_icons: ^1.0.6

  # Cartes
  google_maps_flutter: ^2.5.0
  geolocator: ^11.0.0

  # Stockage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.1.1
  shared_preferences: ^2.2.2

  # Utilitaires
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  pdf: ^3.10.8
  google_mlkit_text_recognition: ^0.13.0
  mobile_scanner: ^5.2.3
  share_plus: ^12.0.2
  url_launcher: ^6.2.3
  image_picker: ^1.0.4
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env