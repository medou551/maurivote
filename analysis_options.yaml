include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Erreurs bloquantes (fail le CI)
    invalid_annotation_target: ignore   # Pour freezed
    missing_required_param: error
    undefined_class: error
    undefined_function: error
    return_of_invalid_type: error
    type_check_is_not_null: warning
    dead_code: warning

  exclude:
    - "**/*.g.dart"         # Fichiers générés (json_serializable)
    - "**/*.freezed.dart"   # Fichiers générés (freezed)
    - lib/l10n/*.dart       # Fichiers générés (i18n)

linter:
  rules:
    # ── Qualité du code ─────────────────────────────────────────────────────
    always_declare_return_types: true
    avoid_print: true                   # Utiliser debugPrint() à la place
    avoid_dynamic_calls: false
    avoid_empty_else: true
    avoid_redundant_argument_values: true
    avoid_returning_null_for_void: true
    avoid_void_async: true
    cancel_subscriptions: true          # Crucial pour les StreamSubscriptions
    close_sinks: true                   # Crucial pour les StreamControllers
    
    # ── Sécurité ────────────────────────────────────────────────────────────
    avoid_web_libraries_in_flutter: true
    no_runtimeType_toString: true
    
    # ── Flutter ─────────────────────────────────────────────────────────────
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    sized_box_for_whitespace: true
    use_colored_box: true
    use_decorated_box: true
    
    # ── Dart ────────────────────────────────────────────────────────────────
    prefer_final_fields: true
    prefer_final_locals: false          # Trop restrictif en pratique
    prefer_single_quotes: true
    require_trailing_commas: true       # Meilleur diff Git
    sort_pub_dependencies: false        # Organisés manuellement par catégorie
    
    # ── Nommage ─────────────────────────────────────────────────────────────
    file_names: true
    package_names: true
    
    # ── Désactivés (trop stricts pour ce projet) ─────────────────────────
    public_member_api_docs: false
    lines_longer_than_80_chars: false
